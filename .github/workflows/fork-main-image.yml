name: Publish fork main image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-main-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/sussdorff/cli-proxy-api
  SOURCE: https://github.com/sussdorff/CLIProxyAPI

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Fail closed outside the approved fork and revision shape
        shell: bash
        run: |
          set -euo pipefail
          if test "${GITHUB_REPOSITORY}" != "sussdorff/CLIProxyAPI"; then
            echo "Refusing to publish from ${GITHUB_REPOSITORY}." >&2
            exit 1
          fi
          if test "${GITHUB_REF}" != "refs/heads/main"; then
            echo "Refusing to publish from ${GITHUB_REF}; only refs/heads/main is approved." >&2
            exit 1
          fi
          if ! printf '%s' "${GITHUB_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "GITHUB_SHA is not a full commit revision." >&2
            exit 1
          fi

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Derive reproducible build context
        id: build_context
        shell: bash
        run: |
          set -euo pipefail
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          echo "created=${created}" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=main
          labels: |
            org.opencontainers.image.source=https://github.com/sussdorff/CLIProxyAPI
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build_context.outputs.created }}

      - name: Build and publish multi-arch image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build_context.outputs.created }}
            SOURCE=${{ env.SOURCE }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.build_context.outputs.created }}

      - name: Record published manifest
        shell: bash
        run: |
          set -euo pipefail
          printf '{"image":"%s","revision":"%s","digest":"%s"}\n' \
            "${IMAGE}" "${GITHUB_SHA}" "${{ steps.build.outputs.digest }}" >> "${GITHUB_STEP_SUMMARY}"
